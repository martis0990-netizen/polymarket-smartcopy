name: Limitless hourly Markov shadow
on:
  pull_request:
    paths:
      - research/limitless_hourly_markov_shadow.py
      - .github/workflows/limitless-hourly-markov-shadow.yml

permissions:
  contents: read
  actions: read

jobs:
  archived-markov-shadow:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Replay frozen source events
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/limitless_hourly_markov_shadow.py
          python research/limitless_hourly_markov_shadow.py --output markov_evidence.json
      - name: Publish machine rows in job log for permanent research evidence
        run: |
          python - <<'PY'
          import json
          s=json.dumps(json.load(open('markov_evidence.json')),separators=(',',':'))
          for i in range(0,len(s),2500):
              print(f'MARKOV_JSON_PART:{i//2500:04d}:{s[i:i+2500]}')
          PY
      - name: Preserve full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-hourly-markov-shadow-${{ github.run_id }}
          path: markov_evidence.json
          if-no-files-found: warn
          retention-days: 30

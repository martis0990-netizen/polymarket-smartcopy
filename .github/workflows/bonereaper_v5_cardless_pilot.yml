name: Bonereaper v5 cardless pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonereaper-v5-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector
        run: python -m pip install -e .
      - name: Record twenty-minute prospective bundle
        env:
          POLYMARKET_CLOB_API_KEY: ${{ secrets.POLYMARKET_CLOB_API_KEY }}
          POLYMARKET_CLOB_API_SECRET: ${{ secrets.POLYMARKET_CLOB_API_SECRET }}
          POLYMARKET_CLOB_API_PASSPHRASE: ${{ secrets.POLYMARKET_CLOB_API_PASSPHRASE }}
        run: |
          set -euo pipefail
          for key in POLYMARKET_CLOB_API_KEY POLYMARKET_CLOB_API_SECRET POLYMARKET_CLOB_API_PASSPHRASE; do
            if [ -z "${!key}" ]; then
              echo "Missing required GitHub Actions secret: ${key}" >&2
              exit 1
            fi
          done
          python -m smartcopy.cross_asset_capture \
            --output-dir artifacts/bonereaper-v5-gha \
            --duration-seconds 1200 \
            --code-commit "$GITHUB_SHA"
      - name: Record manifest digest and preserve raw files
        if: always()
        run: |
          set -euo pipefail
          if [ -d artifacts/bonereaper-v5-gha ]; then
            tar -czf bonereaper-v5-gha.tar.gz -C artifacts bonereaper-v5-gha
            sha256sum bonereaper-v5-gha.tar.gz >> "$GITHUB_STEP_SUMMARY"
            if [ -f artifacts/bonereaper-v5-gha/cross_asset_capture_manifest.json ]; then
              sha256sum artifacts/bonereaper-v5-gha/cross_asset_capture_manifest.json >> "$GITHUB_STEP_SUMMARY"
            else
              echo 'No clean-finalize manifest. This partial bundle is diagnostic only.' >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo 'Capture directory was never created.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload immutable bundle archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bonereaper-v5-${{ github.run_id }}-${{ github.run_attempt }}
          path: bonereaper-v5-gha.tar.gz
          if-no-files-found: ignore
          retention-days: 7

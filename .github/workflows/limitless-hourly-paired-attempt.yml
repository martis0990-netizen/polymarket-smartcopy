name: Limitless hourly paired paper attempt
on:
  pull_request:
    paths:
      - research/limitless_hourly_paired_attempt.py
      - .github/workflows/limitless-hourly-paired-attempt.yml

permissions:
  contents: read
  actions: read

jobs:
  archived-paired-attempt:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Replay verified public archive books
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m py_compile research/limitless_hourly_paired_attempt.py
          python research/limitless_hourly_paired_attempt.py --output paired_attempt_evidence.json
      - name: Preserve paper evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-hourly-paired-attempt-${{ github.run_id }}
          path: paired_attempt_evidence.json
          if-no-files-found: warn
          retention-days: 30

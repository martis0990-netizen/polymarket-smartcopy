name: Limitless forward paper observer

on:
  pull_request:
    branches: [main]
    paths:
      - research/limitless_smartcopy_probe.py
      - research/test_limitless_wallet_profile.py
      - research/limitless_wallet_profile.py
      - research/limitless_entry_availability.py
      - research/test_limitless_entry_availability.py
      - research/LIMITLESS_PROBE.md
      - .github/workflows/limitless-readonly-probe.yml
  push:
    branches: [main]
    paths:
      - research/limitless_smartcopy_probe.py
      - research/test_limitless_wallet_profile.py
      - research/limitless_wallet_profile.py
      - research/limitless_entry_availability.py
      - research/test_limitless_entry_availability.py
      - research/LIMITLESS_PROBE.md
      - .github/workflows/limitless-readonly-probe.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('limitless-probe-pr-{0}', github.event.pull_request.number) || 'limitless-forward-paper' }}
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 63
    permissions:
      contents: read
      actions: write
    env:
      CUTOFF_UTC: '2026-10-10T09:00:00Z'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check bounded study window
        id: window
        shell: bash
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d "$CUTOFF_UTC" +%s)" ]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/limitless-final-audit.yml/dispatches" -f ref=main
              gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/limitless-readonly-probe.yml/disable"
            fi
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.window.outputs.active == 'true'
      - name: Verify probe
        if: steps.window.outputs.active == 'true'
        run: |
          python3 research/limitless_smartcopy_probe.py --selftest
          python3 -m unittest discover -s research -p 'test_limitless_wallet_profile.py' -v
          python3 -m unittest discover -s research -p 'test_limitless_entry_availability.py' -v
      - name: Observe public feed and wallet histories
        if: steps.window.outputs.active == 'true'
        shell: bash
        run: |
          MINUTES=55
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "$GITHUB_EVENT_NAME" = push ]; then MINUTES=3; fi
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then MINUTES=1; fi
          python3 research/limitless_smartcopy_probe.py \
            --minutes "$MINUTES" --interval 30 --until "$CUTOFF_UTC" --out limitless_probe
      - name: Measure observed entry availability
        if: always() && steps.window.outputs.active == 'true'
        run: |
          if [ -f limitless_probe/summary.json ]; then
            python3 research/limitless_entry_availability.py --out limitless_probe
          fi
      - name: Print summary
        if: always()
        run: |
          if [ -f limitless_probe/summary.json ]; then cat limitless_probe/summary.json; fi
      - name: Upload observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: limitless-probe-${{ github.run_id }}
          path: limitless_probe/
          if-no-files-found: warn
          retention-days: 14
      - name: Queue next bounded observation
        if: always() && steps.window.outputs.active == 'true' && github.event_name != 'pull_request'
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/limitless-readonly-probe.yml/dispatches" -f ref=main

name: Live wallet observer v1 smoke

on:
  push:
    branches: [build/live-wallet-observer-v1]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SmartCopy
        run: python -m pip install -e .
      - name: Observe Bonereaper for 120 seconds
        run: |
          python -m smartcopy.live_observer \
            --wallet 0xeebde7a0e019a63e6b476eb425505b7b3e6eba30 \
            --output observer-smoke \
            --duration-seconds 120 \
            --poll-interval-seconds 1
      - name: Verify smoke evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('observer-smoke')
          manifest = json.loads((root / 'observer_manifest.json').read_text())
          assert manifest['schema_version'] == 'smartcopy-live-wallet-observer-v1'
          assert manifest['observation_mode'] == 'live_observed'
          assert manifest['wallet'] == '0xeebde7a0e019a63e6b476eb425505b7b3e6eba30'
          assert manifest['poll_cycle_count'] >= 2
          assert manifest['api_page_count'] >= manifest['poll_cycle_count']
          assert manifest['baseline_row_count'] > 0
          assert manifest['gap_failures'] == 0
          assert (root / 'live_activity.jsonl').is_file()
          assert (root / 'poll_cycles.jsonl').is_file()
          live_lines = (root / 'live_activity.jsonl').read_text().splitlines()
          assert len(live_lines) == manifest['emitted_prospective_row_count']
          for line in live_lines:
              row = json.loads(line)
              assert row['observation_mode'] == 'live_observed'
              assert row['observation_delay_seconds'] >= 0
          if live_lines:
              delays = manifest['observation_delay_seconds']
              assert delays['p50'] is not None and delays['p90'] is not None and delays['p99'] is not None
          print(json.dumps(manifest, sort_keys=True, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: live-wallet-observer-v1-smoke
          path: observer-smoke
          retention-days: 30

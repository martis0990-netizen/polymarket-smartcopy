name: Unmatched outcome alignment verification

on:
  push:
    branches: [build/unmatched-outcome-alignment]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SmartCopy
        run: python -m pip install -e .
      - name: Run frozen 2026-08-25 verification
        run: |
          python - <<'PY'
          import json
          from dataclasses import asdict
          from datetime import datetime, timezone
          from pathlib import Path

          from smartcopy.polymarket import PolymarketDataAPI
          from smartcopy.settlement_backfill import collect_closed_positions_interval
          from smartcopy.unmatched_outcome_alignment import (
              analyze_unmatched_outcome_alignment,
              summarize_unmatched_outcome_alignment,
          )

          wallet = '0xeebde7a0e019a63e6b476eb425505b7b3e6eba30'
          start = 1787616000
          end = 1787702399
          client = PolymarketDataAPI()
          activity = client.collect_activity_range(wallet, start=start, end=end)
          closed_evidence = collect_closed_positions_interval(
              client,
              wallet,
              start=datetime.fromtimestamp(start, tz=timezone.utc),
              end=datetime.fromtimestamp(end, tz=timezone.utc),
          )
          rows = analyze_unmatched_outcome_alignment(activity, closed_evidence.rows)
          summary = summarize_unmatched_outcome_alignment(rows)
          payload = {
              'wallet': wallet,
              'range': {'start': start, 'end': end},
              'activity_rows': len(activity),
              'closed_rows': len(closed_evidence.rows),
              'closed_pages': closed_evidence.pages_fetched,
              'closed_missing_timestamp_count': closed_evidence.missing_timestamp_count,
              'alignment_rows': len(rows),
              'summary': asdict(summary),
          }
          Path('unmatched_outcome_alignment_result.json').write_text(
              json.dumps(payload, sort_keys=True, indent=2), encoding='utf-8'
          )
          print(json.dumps(payload, sort_keys=True, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unmatched-outcome-alignment-2026-08-25
          path: unmatched_outcome_alignment_result.json
          retention-days: 30
